name: update-universe-bars-part2

# Phase 0 (docs/dev_plan_recommendations.md): Sunday sibling of
# _part1.yml -- see that file's header comment for the full "why split
# into two" derivation. This half only differs by cron day and --half 2.
on:
  schedule:
    - cron: '0 20 * * 0'   # 每週日 UTC 20:00 ≈ 台北週一 04:00，避開交易時段
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: '只抓取/合併/還原因子並印出結果，不寫回 cache/factor_run/*.json，也不發 Telegram'
        default: false
      limit:
        type: string
        description: '只處理後半裡的前 N 檔（留空 = 整個後半），本機外的小樣本測試用'
        default: ''
      lookback_days:
        type: string
        description: '每檔回抓天數（留空 = 預設 30）。一次性補開高低價歷史填 5300（涵蓋快取全部歷史，約 14 年）；該次每檔多抓長區間，耗時與週更新同量級'
        default: ''

concurrency:
  group: update-universe-bars
  cancel-in-progress: false

jobs:
  update-universe-bars-part2:
    runs-on: ubuntu-24.04
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 建在 Environment「Cloudflare」底下
    # （沿用 optimize.yml/deploy-worker.yml 的既有 secrets，同一組 Telegram bot）；
    # 沒有這行 secrets.* 會全部解析成空字串。
    environment: Cloudflare
    env:
      # update_universe_bars.py pulls daily bars from FinMind and its limiter
      # assumes the token's 600 req/hr tier; without it the free tier's lower hourly
      # cap applies (workflow was missing it; found 2026-10-02 while seeding).
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: check secrets
        run: |
          missing=""
          [ -z "$FINMIND_TOKEN" ] && missing="$missing FINMIND_TOKEN"
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少或空白的 secrets:$missing（Settings → Environments → Cloudflare）"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # 唯一跨執行需要留存的狀態：cache/factor_run 的 per-code JSON 快取本身
      # （這支 workflow 不碰 backtest.db，只重寫 bars）。跟 _part1.yml 共用同一組
      # restore-keys 前綴，確保兩邊都撈回對方最新寫入的內容，不會互相覆蓋。
      - uses: actions/cache@v4
        with:
          path: cache/factor_run
          key: update-universe-bars-state-${{ github.run_id }}
          restore-keys: |
            update-universe-bars-state-
      - name: update_universe_bars（後半）
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          args="--half 2"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args="$args --limit ${{ inputs.limit }}"
          fi
          if [ -n "$LOOKBACK_DAYS" ]; then
            args="$args --lookback-days $LOOKBACK_DAYS"
          fi
          python scripts/update_universe_bars.py $args
