name: optimize

# Phase 6c/6d (docs/https-finlab-finance-blog-python-get-tai-memoized-
# lighthouse.md, docs/adr/0002-auto-apply-ranking-weights.md): monthly
# re-evaluation of finlab_factors.RANKING_WEIGHTS against a fresh rank-IC-
# derived candidate, auto-applied/rolled-back by scripts/run_ranking_optimize.py.
#
# cache/factor_run/*.json's daily bars are kept fresh (<=1 week stale) by
# .github/workflows/update_universe_bars_part1.yml/_part2.yml (Phase 0,
# docs/dev_plan_recommendations.md) -- this job restores that lineage
# read-only below (a separate actions/cache/restore@v4 step, distinct key
# prefix) rather than re-fetching it itself. Before 2026-08-24 this job
# bundled cache/factor_run into its OWN "optimize-state-" cache key
# together with backtest.db, so it only ever saw whatever it had last
# saved itself -- a self-referential snapshot that never advanced except
# when this job ran (monthly), never actually refreshed. That was this
# comment's original "KNOWN GAP" (kept in git history, not restated here
# since it's now fixed).
#
# REMAINING GAP: revenue/financials (as opposed to daily bars) still have
# no incremental fetcher -- scripts/run_factor_backtest.py's only path for
# those is a full ~19-22h --universe all pull. Same for the lighthouse.md
# Phase 6c "每季全量重抛 universe 清單" step (new/delisted codes). Both are
# still manual/unscheduled.
on:
  schedule:
    - cron: '0 22 1 * *'   # 每月 1 號台北 06:00（UTC 前一天 22:00）
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: '只評估、不寫 meta/optimization_runs、不發 Telegram'
        default: false

concurrency:
  # Shared with daily_recommendations.yml's group name on purpose: both jobs
  # read+write src/data/backtest.db through the same optimize-state- cache
  # lineage (see the cache step comments below), so they must never run at
  # the same time -- a concurrent save from either one would silently
  # overwrite the other's write to a full-file cache blob (no merge). This
  # serializes them (cancel-in-progress: false queues, doesn't cancel) at
  # the cost of daily_recommendations.yml occasionally waiting for a
  # same-day optimize.yml run to finish (only possible on day 1 of the
  # month, when both are scheduled ~1 hour apart).
  group: backtest-db-state
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 建在 Environment「Cloudflare」底下
    # （沿用 deploy-worker.yml 的既有 secrets，同一組 Telegram bot）；沒有這行
    # secrets.* 會全部解析成空字串（見 snapshot.yml 的同類註解）。
    environment: Cloudflare
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: check secrets
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少或空白的 secrets:$missing（Settings → Environments → Cloudflare）"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # cache/factor_run 的血統歸 update_universe_bars_part1/2.yml 管（Phase 0）
      # ——這個 job 只讀不寫，restore-only，避免跟它們的儲存互相打架（actions/cache
      # 的 key 對應單一整包歸檔，還原時不分路徑，兩邊若共用同一個 key 存寫，
      # 後存的會把先還原的整個蓋掉）。
      - uses: actions/cache/restore@v4
        with:
          path: cache/factor_run
          key: update-universe-bars-state-${{ github.run_id }}
          restore-keys: |
            update-universe-bars-state-
      # backtest.db 存 meta.active_ranking_weights/previous_ranking_weights
      # 與 optimization_runs 試驗紀錄，是這個 job 自己讀寫的狀態，跟上面
      # cache/factor_run 的血統分開存（理由同上，避免整包互相覆蓋）。
      # save: 'true' -- 這個 job 會寫回，見 .github/actions/backtest-db-cache/action.yml。
      - uses: ./.github/actions/backtest-db-cache
        with:
          save: 'true'
      - name: run_ranking_optimize
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_ranking_optimize.py --dry-run
          else
            python scripts/run_ranking_optimize.py
          fi
