name: apply_strategy_candidate

# Manual application step for scripts/run_strategy_search.py's pending
# candidate (docs/adr/0003-manual-review-for-strategy-logic-search.md).
# workflow_dispatch-only, no schedule -- a human decides when to apply or
# reject, that IS ADR 0003's whole point.
#
# Runs INSIDE GitHub Actions, not on a contributor's local machine, on
# purpose: the real backtest.db that scripts/run_ranking_optimize.py and
# scripts/run_daily_recommendations.py actually read/write only exists
# inside this repo's backtest-db-state actions/cache lineage (see
# .github/actions/backtest-db-cache) -- there is no server, no shared file,
# just a cache blob that only a workflow run can restore/save. A local
# `python scripts/apply_strategy_candidate.py` run opens src/db.py's
# DB_PATH default instead, a throwaway file with no relation to that cache
# -- it would print "已套用候選 ..." and look like it worked while writing
# to a database no scheduled job will ever read, silently never reaching
# production. This workflow is the fix: trigger it from the Actions tab
# (or `gh workflow run`) so the apply/reject actually lands in the same
# cache lineage every other pipeline reads.
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        description: '要核對的 run_id（留空 = 直接套用/捨棄目前的 pending 候選，不核對是否一致）'
        default: ''
      reject:
        type: boolean
        description: '勾選 = 捨棄待審候選，不套用'
        default: false

concurrency:
  # Shared with optimize.yml/daily_recommendations.yml/strategy_search.yml
  # on purpose -- see backtest-db-cache's own description: all four jobs
  # read+write src/data/backtest.db through the same optimize-state- cache
  # lineage, so they must never run at the same time (actions/cache has no
  # merge, just whole-file overwrite by save time).
  group: backtest-db-state
  cancel-in-progress: false

jobs:
  apply_strategy_candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # save: 'true' -- this job writes active_ranking_weights/
      # previous_ranking_weights/active_weights_source/pending_strategy_
      # candidate and must save the result back, same as optimize.yml/
      # strategy_search.yml/daily_recommendations.yml.
      - uses: ./.github/actions/backtest-db-cache
        with:
          save: 'true'
      - name: apply_strategy_candidate
        run: |
          ARGS=""
          if [ -n "${{ inputs.run_id }}" ]; then
            ARGS="$ARGS --run-id ${{ inputs.run_id }}"
          fi
          if [ "${{ inputs.reject }}" = "true" ]; then
            ARGS="$ARGS --reject"
          fi
          python scripts/apply_strategy_candidate.py $ARGS
