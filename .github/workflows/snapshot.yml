name: snapshot

on:
  schedule:
    - cron: '7,27,47 1-5 * * 1-5'   # light（台北 09:07-13:47 每 20 分）
    - cron: '10 0 * * 1-5'          # full（台北 08:10 早晨重建）
    - cron: '40 13 * * 1-5'         # full（台北 21:40 盤後籌碼齊）
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, light]
        default: full

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 4 個 secrets 建在 Environment「Cloudflare」底下，job 必須宣告 environment
    # 才拿得到；沒有這行的話 secrets.* 全部解析成空字串（wrangler 會噴
    # "Must specify a project name."）
    environment: Cloudflare
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: check secrets
        # 提早檢查必要 secrets 都非空，避免後面 wrangler 噴出隱晦的
        # "Must specify a project name."；注意 secret 要加在 Secrets 分頁而非 Variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_PAGES_PROJECT" ] && missing="$missing CF_PAGES_PROJECT"
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$FINMIND_TOKEN" ] && missing="$missing FINMIND_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少或空白的 secrets:$missing（請到 Settings → Secrets and variables → Actions 的 Secrets 分頁確認，不是 Variables 分頁）"
            exit 1
          fi
          echo "所有必要 secrets 都在。"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      - id: mode
        # schedule 事件用 github.event.schedule 與 cron 字串精確比對（必須與 on.schedule 逐字一致）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7,27,47 1-5 * * 1-5" ]; then
            echo "mode=light" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
      - run: python snapshot.py --mode "${{ steps.mode.outputs.mode }}" --out dist --base-url "https://${CF_PAGES_PROJECT}.pages.dev"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: create pages project (idempotent)
        run: npx wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy
        run: npx wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
