name: shadow-portfolio

# Forward shadow portfolio (docs/shadow_portfolio_spec_2026-11.md, plan:
# docs/shadow_portfolio_impl_plan_2026-11.md stage 4). Independent of
# daily_recommendations.yml on purpose: it does not touch backtest.db, so it must not
# queue behind the `backtest-db-state` group, and a failure elsewhere must not stop it.
#
# What it does every Taipei weekday 07:00:
#   1. --prefetch (only if meta/lock.json exists): store the market close + ex-rights data
#      for days not stored yet (data files only; the only mode allowed before the start date).
#   2. the main run (only if meta/lock.json exists and today >= start_date; a dry-run
#      dispatch is exempt): book the previous trading day for all 4 candidates + 0050,
#      compute today's rankings.
#   3. commit + push the ledger branch (append-only history = evidence that nothing
#      was edited after the fact).
#   4. Telegram: on a non-zero exit code or any alert in meta/last_run.json; on
#      Mondays also the weekly summary.
# The ledger lives on its own branch (default `shadow-ledger`), checked out into
# shadow_ledger/ (gitignored on main). Needs `contents: write` to push that branch.
on:
  schedule:
    - cron: '0 23 * * 0-4'   # Taipei Mon-Fri 07:00 (UTC the day before 23:00)
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Main run with --dry-run (compute only, write nothing, no push)'
        default: false
      ledger_branch:
        type: string
        description: 'Ledger branch (rehearsals use shadow-ledger-rehearsal)'
        default: 'shadow-ledger'
      prefetch_only:
        type: boolean
        description: 'Only run --prefetch (skip the main run)'
        default: false

concurrency:
  group: shadow-portfolio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Same Environment as the other workflows: the Telegram secrets live there.
    environment: Cloudflare
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LEDGER_BRANCH: ${{ inputs.ledger_branch || 'shadow-ledger' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # cache/factor_run is read-only here; its lineage belongs to
      # update_universe_bars_part1/2.yml / update_fundamentals.yml.
      - uses: actions/cache/restore@v4
        with:
          path: cache/factor_run
          key: update-universe-bars-state-${{ github.run_id }}
          restore-keys: |
            update-universe-bars-state-
      - name: check factor_run cache
        run: |
          n=$(ls cache/factor_run 2>/dev/null | wc -l)
          echo "factor_run files: $n"
          if [ "$n" -lt 1500 ]; then
            echo "::error::cache/factor_run has only $n files (expected >= 1500)"
            echo "FACTOR_RUN_MISSING=1" >> "$GITHUB_ENV"
          fi
      - name: prepare ledger branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$LEDGER_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LEDGER_BRANCH"
            git worktree add -B "$LEDGER_BRANCH" shadow_ledger "origin/$LEDGER_BRANCH"
          else
            echo "ledger branch $LEDGER_BRANCH does not exist yet -> orphan"
            git worktree add --orphan -b "$LEDGER_BRANCH" shadow_ledger
          fi
          # a crashed job may leave *.tmp files behind; never commit them
          printf '*.tmp\n' > shadow_ledger/.gitignore
      - name: prefetch market data
        id: prefetch
        if: env.FACTOR_RUN_MISSING != '1'
        continue-on-error: true
        run: |
          # --prefetch reads the locked snapshots, so it needs meta/lock.json too
          if [ ! -f shadow_ledger/meta/lock.json ]; then
            echo "no meta/lock.json yet -> the experiment is not locked; prefetch skipped"
            exit 0
          fi
          python scripts/run_shadow_portfolio.py --ledger-dir shadow_ledger --prefetch
      - name: main run
        id: main
        if: env.FACTOR_RUN_MISSING != '1' && inputs.prefetch_only != true
        continue-on-error: true
        run: |
          if [ ! -f shadow_ledger/meta/lock.json ]; then
            echo "no meta/lock.json yet -> the experiment is not locked; main run skipped"
            exit 0
          fi
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          # Before the start date only --dry-run is allowed (check_lock exits 3 otherwise), so a
          # scheduled run in the lock-to-start window must be a no-op rather than a red run + alert.
          if [ -z "$args" ]; then
            start=$(python -c "import json; print(json.load(open('shadow_ledger/meta/lock.json', encoding='utf-8')).get('start_date') or '')")
            today=$(TZ=Asia/Taipei date +%Y-%m-%d)
            if [ -n "$start" ] && [[ "$today" < "$start" ]]; then
              echo "today $today is before the start date $start; main run skipped (prefetch only)"
              exit 0
            fi
          fi
          python scripts/run_shadow_portfolio.py --ledger-dir shadow_ledger $args
      - name: commit and push ledger
        if: always() && env.FACTOR_RUN_MISSING != '1' && inputs.dry_run != true
        working-directory: shadow_ledger
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "shadow ledger $(TZ=Asia/Taipei date +%Y-%m-%d) (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:refs/heads/$LEDGER_BRANCH"
      - name: weekly summary (Monday Taipei)
        if: always() && env.FACTOR_RUN_MISSING != '1' && steps.main.outcome == 'success'
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" != "1" ] || [ ! -f shadow_ledger/meta/lock.json ]; then
            exit 0
          fi
          python scripts/run_shadow_portfolio.py --ledger-dir shadow_ledger --summary > summary.txt || exit 0
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(cat summary.txt)" > /dev/null || echo "::warning::Telegram failed"
      - name: alert
        if: always()
        run: |
          msg=""
          if [ "$FACTOR_RUN_MISSING" = "1" ]; then msg="$msg\ncache/factor_run missing/too small; nothing was run"; fi
          if [ "${{ steps.prefetch.outcome }}" = "failure" ]; then msg="$msg\nprefetch step failed"; fi
          if [ "${{ steps.main.outcome }}" = "failure" ]; then msg="$msg\nmain run failed (exit code != 0; 2=void, 3=lock check, 4=replay mismatch)"; fi
          if [ -f shadow_ledger/meta/last_run.json ]; then
            alerts=$(python - <<'PY'
          import json
          try:
              d = json.load(open("shadow_ledger/meta/last_run.json", encoding="utf-8"))
          except Exception:
              d = {}
          for a in d.get("alerts", [])[:20]:
              print(a)
          PY
          )
            if [ -n "$alerts" ]; then msg="$msg\n$alerts"; fi
          fi
          if [ -n "$msg" ]; then
            text=$(printf '[shadow portfolio] %s\n%s' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$(printf "$msg")")
            curl -sS --max-time 20 \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" > /dev/null || echo "::warning::Telegram failed"
          fi
      - name: fail the job if prefetch or main run failed
        if: always() && (steps.prefetch.outcome == 'failure' || steps.main.outcome == 'failure' || env.FACTOR_RUN_MISSING == '1')
        run: exit 1
