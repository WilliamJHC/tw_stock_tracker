name: deploy-tv-webhook

# 手動觸發即可：Worker 程式碼很少變，不需要排程（跟 snapshot.yml 不同）。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # secrets 沿用 snapshot.yml 的 Environment「Cloudflare」；少了這行
    # secrets.* 會全部解析成空字串（見 README 故障排查）
    environment: Cloudflare
    steps:
      - uses: actions/checkout@v5
      - name: check secrets
        env:
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TV_WEBHOOK_SECRET: ${{ secrets.TV_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_WORKER_API_TOKEN" ] && missing="$missing CLOUDFLARE_WORKER_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$TV_WEBHOOK_SECRET" ] && missing="$missing TV_WEBHOOK_SECRET"
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少或空白的 secrets:$missing（Settings → Environments → Cloudflare）"
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eiq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不對（要 32 位十六進位字串）"
            exit 1
          fi
          echo "所有必要 secrets 都在。"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: deploy worker
        working-directory: worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: push worker secrets
        # 每次部署都重推，確保 Worker 端的值跟 repo secrets 一致；
        # wrangler secret put 從 stdin 讀值，不會出現在指令列或 log 裡
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TV_WEBHOOK_SECRET: ${{ secrets.TV_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TV_WEBHOOK_SECRET"  | npx wrangler@4 secret put TV_WEBHOOK_SECRET
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler@4 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID"   | npx wrangler@4 secret put TELEGRAM_CHAT_ID
