name: daily-recommendations

# Phase 1 (docs/dev_plan_recommendations.md): daily top-5 all-market
# recommendation ranking, recomputed from whatever cache/factor_run/*.json
# currently holds (kept <=1-2 weeks fresh by update_universe_bars_part1/2.yml,
# Phase 0) and meta.active_ranking_weights (kept current by optimize.yml,
# Phase 6d/ADR 0002). This job never fetches from FinMind/Yahoo itself --
# composite_scores() is stdlib-only and cheap, safe to run daily even
# though its inputs only refresh weekly/monthly. (Exception: the second step,
# run_pullback_scan, does fetch FinMind -- see its own comment below.)
#
# Cache wiring: cache/factor_run is restore-only, from the SAME
# update-universe-bars-state- lineage Phase 0's workflows write to (NOT
# bundled with backtest.db -- see optimize.yml's own comment on why
# bundling two differently-owned paths under one actions/cache key causes
# a full-archive-restore to clobber whichever one didn't just get
# refreshed). backtest.db shares optimize.yml's own optimize-state- lineage
# read-write, since that's the only source of meta.active_ranking_weights
# and the only place meta.daily_recommendations needs to end up.
on:
  schedule:
    - cron: '0 23 * * 0-4'   # 台北時間週一~週五 07:00（UTC 前一天 23:00），開盤前
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: '只計算並印出結果，不寫 meta，也不發 Telegram'
        default: false
      top_n:
        type: string
        description: '取前 N 檔（留空 = 5）'
        default: ''

concurrency:
  # Shared group with optimize.yml -- see its concurrency comment for why
  # (both jobs read+write src/data/backtest.db through the same
  # optimize-state- cache lineage).
  group: backtest-db-state
  cancel-in-progress: false

jobs:
  daily-recommendations:
    runs-on: ubuntu-24.04
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 建在 Environment「Cloudflare」底下
    # （沿用 optimize.yml/update_universe_bars_part1.yml 的既有 secrets，同一組
    # Telegram bot）；沒有這行 secrets.* 會全部解析成空字串。
    environment: Cloudflare
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: check secrets
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少或空白的 secrets:$missing（Settings → Environments → Cloudflare）"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      # cache/factor_run 只讀，血統歸 update_universe_bars_part1/2.yml 管
      # （Phase 0）——這個 job 從不寫回它，避免跟它們的儲存互相打架。
      - uses: actions/cache/restore@v4
        with:
          path: cache/factor_run
          key: update-universe-bars-state-${{ github.run_id }}
          restore-keys: |
            update-universe-bars-state-
      # backtest.db 跟 optimize.yml 共用同一個 optimize-state- 血統：讀它寫的
      # active_ranking_weights，寫自己的 daily_recommendations，兩者互不干擾
      # （同一個 key 前綴，不同的 meta key，SQLite 檔案層級共用沒有衝突）。
      # save: 'true' -- 這個 job 會寫回，見 .github/actions/backtest-db-cache/action.yml。
      - uses: ./.github/actions/backtest-db-cache
        with:
          save: 'true'
      - name: run_daily_recommendations
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ -n "${{ inputs.top_n }}" ]; then
            args="$args --top-n ${{ inputs.top_n }}"
          fi
          python scripts/run_daily_recommendations.py $args
      # 強勢股回調買法（第二種選股法，docs/pullback_strategy.md / ADR 0007）。
      # 放在多因子那一步之後、同一個 job：共用上面 restore 的 factor_run 與
      # backtest.db，結果寫進 meta.pullback_watchlist，job 結束時由
      # backtest-db-cache 一併存回。continue-on-error：掃描失敗（FinMind 額度、
      # 快取為空）不能讓多因子那一步已寫入的 meta 存不回去。失敗不再靜默：
      # 缺 token、腳本 crash、或日線抓取失敗過半（腳本 exit 1、不覆寫 meta）
      # 都會讓這個 step 失敗，由下一個 step 發 Telegram 通知。
      # 與前一步不同，這一步會對最多 120 檔各打一次 FinMind，所以需要
      # FINMIND_TOKEN；只設在這個 step，前一步仍然不碰網路。
      # 2026-10-24 停用：日線代理回測未通過（平均 net_r -0.045，見
      # docs/pullback_backtest_result_2026-10.md），Luk 式研究方向已結束。
      # 程式與測試保留；要重開把下面這行 `if: false` 拿掉即可。
      - name: run_pullback_scan
        id: pullback_scan
        if: false
        continue-on-error: true
        # 最多 120 檔循序抓取，卻佔著共用的 backtest-db-state concurrency
        # group；FinMind 卡住時不能讓它一路拖到 6 小時預設上限、擋住後面
        # 要寫 DB 的 job。逾時算失敗，會走下面的 Telegram 通知。
        timeout-minutes: 20
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -z "$FINMIND_TOKEN" ]; then
            echo "::error::缺少 FINMIND_TOKEN（Settings → Environments → Cloudflare），無法執行強勢回調掃描"
            exit 1
          fi
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          python scripts/run_pullback_scan.py $args
      - name: notify_pullback_scan_failure
        if: steps.pullback_scan.outcome == 'failure'
        run: |
          msg="[強勢回調] 每日掃描失敗，watchlist 未更新：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${msg}" \
            > /dev/null || echo "::warning::Telegram 通知失敗"
